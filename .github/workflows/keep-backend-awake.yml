name: Keep backend awake

on:
  schedule:
    # Render sleeps idle free services; a ping every 10 minutes keeps it warm.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'https://leo-voice-agent-backend.onrender.com/api/health' }}
        run: |
          for attempt in 1 2 3; do
            if curl -sSf --max-time 30 "$HEALTH_URL" > /dev/null; then
              echo "Backend answered on attempt $attempt"
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not answer at $HEALTH_URL"
          exit 1
